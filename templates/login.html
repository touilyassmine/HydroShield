{% extends "base.html" %}
{% block title %}Log in to HydroShield{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-top">
        {% include "partials/mark.html" %}
        <a class="btn btn-ghost btn-sm" href="{{ url_for('welcome') }}" style="margin-left:auto;">Back</a>
    </div>

    <main class="auth-main">
        <div class="auth-card">
            <p class="eyebrow">Welcome back</p>
            <h1>Log in</h1>
            <p class="sub">Check your fields and control irrigation.</p>

            {% if error %}<div class="error-banner">{{ error }}</div>{% endif %}

            <form method="post" action="{{ url_for('login') }}">
                <div class="field-row">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required autofocus>
                </div>
                <div class="field-row">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Your password" required>
                </div>
                <button class="btn btn-primary btn-block" type="submit">Log in</button>
            </form>

            <p class="auth-switch">New to HydroShield? <a href="{{ url_for('signup') }}">Create an account</a></p>
        </div>
    </main>
</div>
{% endblock %}
